<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OI 鏈上 logs 驗證 v6</title>
<style>body{background:#111;color:#eee;font-family:monospace;padding:16px;white-space:pre-wrap;word-break:break-word}h1{font-size:18px}.ok{color:#4ade80}.bad{color:#f87171}.warn{color:#facc15}</style>
</head><body>
<h1>OI 鏈上 logs 驗證 v5（TT 市場終身對照）</h1>
<div id="out">執行緊…</div>
<script>
const P = new URLSearchParams(location.search);
const TT = (P.get('cond')||'0xe6bbe646de3871b22c4a8dcf265669e18efe855527671d437d862030612ee513').toLowerCase(); // 預設 Texas Tech vs Oregon 籃球主盤；?cond= 可改市場
const FROM_ISO = P.get('from')||'2026-11-25T00:00:00Z'; // 預設市場上架日；?from= 可改掃描起點
document.querySelector('h1').textContent = 'OI 鏈上 logs 驗證 v6（終身對照）— ' + TT.slice(0,10) + '…';
const CTF = '0x4D97DCd97eC945f40cF65F87097ACe5EA0476045';
const SPLIT = '0x2e6bb91f8cbcda0c93623c54d0403a43514fabc40084ec96b6d5379a74786298';
const MERGE = '0x6f13ca62553fcc2bcd2372180a43949c1e4cebba603901ede2f4e14f36b282ca';
const RPCS = ['https://polygon-bor.publicnode.com','https://polygon.llamarpc.com','https://rpc.ankr.com/polygon','https://1rpc.io/matic','https://polygon.drpc.org','https://polygon-rpc.com'];
const out = document.getElementById('out');
const lines = [];
function log(s, cls){ lines.push(cls ? '<span class="'+cls+'">'+s+'</span>' : s); out.innerHTML = lines.join('\n'); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function rpcOne(url, method, params, timeoutMs){
  const c = new AbortController(); const t = setTimeout(()=>c.abort(), timeoutMs||20000);
  try{
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({jsonrpc:'2.0', id:1, method, params}), signal:c.signal});
    clearTimeout(t);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if(j.error) throw new Error('RPC err: '+JSON.stringify(j.error));
    return j.result;
  }catch(e){ clearTimeout(t); throw e; }
}
async function rpc(method, params, timeoutMs){
  let lastErr=null;
  for(const u of RPCS){ try{ return await rpcOne(u, method, params, timeoutMs); } catch(e){ lastErr=e; } }
  throw lastErr||new Error('all RPCs failed');
}
async function getLogs(topic, fromB, toB){
  const base = {address: CTF, fromBlock:'0x'+fromB.toString(16), toBlock:'0x'+toB.toString(16)};
  try{ return await rpc('eth_getLogs', [{...base, topics:[topic, null, null, TT]}], 30000); }
  catch(e){ return await rpc('eth_getLogs', [{...base, topics:[topic]}], 30000); } // 唔支援 topics[3] 過濾就拎晒返嚟再喺前端濾
}
async function holdersYes(cond){
  const r = await fetch('https://data-api.polymarket.com/v2/holders?condition='+cond+'&limit=1000');
  const j = await r.json(); const arr = Array.isArray(j)?j:(j.data||[]);
  return arr.map(g=>{ let t=0; for(const x of (g.holders||[])) t+=parseFloat(x.amount||0); return {n:(g.holders||[]).length, tot:t}; });
}
(async ()=>{
  try{ const b = await rpc('eth_blockNumber', [], 8000); log('RPC 通，最新區塊 '+parseInt(b,16),'ok'); }
  catch(e){ log('全部 RPC 都唔通：'+e.message,'bad'); return; }
  const latest = parseInt(await rpc('eth_blockNumber',[]),16);
  const blk = await rpc('eth_getBlockByNumber',['latest',false]);
  const nowTs = parseInt(blk.timestamp,16);
  log('最新區塊 '+latest+'，時間 '+new Date(nowTs*1000).toLocaleString('zh-HK',{timeZone:'Asia/Hong_Kong'}));
  const est = t => Math.round(latest-(nowTs-t)/2.05);
  const fromB = est(Date.parse(FROM_ISO)/1000), toB = latest;
  log('終身窗口：'+FROM_ISO+' → 而家，區塊 '+fromB+' → '+toB+'（約 '+(toB-fromB)+' 區塊）');
  let sSum=0, mSum=0, sN=0, mN=0, chunks=0, fails=0;
  const evs=[];
  async function acc(logs, isSplit){ for(const l of logs){ if((l.topics[3]||'').toLowerCase()===TT){ const amt=Number(BigInt('0x'+l.data.slice(130,194)))/1e6; evs.push({split:isSplit, blk:parseInt(l.blockNumber,16), tx:l.transactionHash, w:(l.topics[1]||'').toLowerCase(), amt}); if(isSplit){ sSum+=amt; sN++; } else { mSum+=amt; mN++; } } } }
  async function scanRange(a,b){ const [x,y]=await Promise.all([getLogs(SPLIT,a,b),getLogs(MERGE,a,b)]); await acc(x,true); await acc(y,false); }
  for(let s=fromB; s<=toB; s+=10000){
    const e=Math.min(s+9999,toB);
    try{ await scanRange(s,e); }
    catch(err){
      // 10000 區塊失敗，拆細做 2000 區塊逐段再試
      let ok=true;
      for(let t=s; t<=e; t+=2000){
        const u=Math.min(t+1999,e);
        try{ await scanRange(t,u); } catch(err2){ ok=false; fails++; log('  段 '+t+'-'+u+' 失敗：'+err2.message,'bad'); }
        await sleep(200);
      }
      if(!ok) log('  段 '+s+'-'+e+' 部分失敗（已拆細重試）','warn');
    }
    chunks++;
    if(chunks%5===0) log('  進度 '+chunks+' 段：累計 split '+sN+' 筆 '+sSum.toFixed(2)+' 股；merge '+mN+' 筆 '+mSum.toFixed(2)+' 股');
    await sleep(300);
  }
  log('掃完：split '+sN+' 筆，共 '+sSum.toFixed(2)+' 股；merge '+mN+' 筆，共 '+mSum.toFixed(2)+' 股；失敗段數 '+fails);
  const net = sSum - mSum;
  log('終身淨 ΔOI（split − merge）= '+net.toFixed(2)+' 股');
  const h = await holdersYes(TT);
  const yesTot = h[0]?h[0].tot:0, noTot = h[1]?h[1].tot:0;
  log('而家 holders：Yes 組 '+(h[0]?h[0].n+' 名，'+yesTot.toFixed(2)+' 股':'無數據')+'；No 組 '+(h[1]?h[1].n+' 名，'+noTot.toFixed(2)+' 股':'無數據'));
  const errY=(net-yesTot), errN=(net-noTot);
  log('對照 Yes：鏈上終身淨 '+net.toFixed(2)+' 股 vs holders Yes 總數 '+yesTot.toFixed(2)+' 股，誤差 '+errY.toFixed(2)+' 股（'+(yesTot?(errY/yesTot*100).toFixed(2)+'%':'n/a')+'）', Math.abs(errY)/Math.max(yesTot,1)<0.03?'ok':'warn');
  log('對照 No：鏈上終身淨 '+net.toFixed(2)+' 股 vs holders No 總數 '+noTot.toFixed(2)+' 股，誤差 '+errN.toFixed(2)+' 股（'+(noTot?(errN/noTot*100).toFixed(2)+'%':'n/a')+'）', Math.abs(errN)/Math.max(noTot,1)<0.03?'ok':'warn');
  if(Math.abs(errY)/Math.max(yesTot,1)<0.03 && Math.abs(errN)/Math.max(noTot,1)<0.03) log('✓ 終身對照通過：鏈上 logs 計出嘅總 OI 同 holders 兩邊總數都吻合，方法證實可用','ok');
  else log('✗ 終身對照唔吻合（注意：已結算市場贖回會燒走股份，終身對照只適用於未結算市場）','bad');
  if(P.get('mode')==='events'){
    log('--- 逐筆事件（按金額由大到細，頭 20 筆）---');
    const big=[...evs].sort((a,b)=>b.amt-a.amt).slice(0,20);
    for(const e of big) log((e.split?'SPLIT ':'MERGE ')+'blk '+e.blk+' 錢包 '+e.w.slice(0,10)+'…'+e.w.slice(-4)+' '+e.amt.toFixed(2)+' 股 tx '+e.tx.slice(0,14)+'…');
    log('--- 每錢包淨額（split − merge，由大到細，頭 20 個）---');
    const wm={};
    for(const e of evs){ const o=wm[e.w]||(wm[e.w]={s:0,m:0}); if(e.split) o.s+=e.amt; else o.m+=e.amt; }
    const wl=Object.entries(wm).map(([w,o])=>({w, net:o.s-o.m, s:o.s, m:o.m})).sort((a,b)=>b.net-a.net).slice(0,20);
    for(const r of wl) log('錢包 '+r.w.slice(0,10)+'…'+r.w.slice(-4)+' split '+r.s.toFixed(2)+' merge '+r.m.toFixed(2)+' 淨 '+r.net.toFixed(2)+' 股');
  }
  log('--- 完成 ---');
})();
</script>
</body></html>
